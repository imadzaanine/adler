services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aldr-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: aldr
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: aldr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: